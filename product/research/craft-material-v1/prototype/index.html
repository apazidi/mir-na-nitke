<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Форма помпона — внутренняя проба</title><link rel="stylesheet" href="style.css"></head>
<body><main class="atelier"><header><div><span class="eyebrow">Мастерская · внутренняя проба</span><h1>Форма помпона</h1></div><button id="reset" class="quiet" title="Начать новую заготовку">Новая<br>заготовка</button></header>
<section class="workplace" aria-label="Рабочий стол"><canvas id="scene" tabindex="0" aria-label="Помпон и ножницы. Ведите ножницы короткими движениями. Клавиатура: стрелки перемещают инструмент, пробел делает один срез." aria-describedby="instruction"></canvas><div id="failure" hidden>Не удалось открыть рабочее место. Обновите страницу.</div><div class="material-label">Мягкая шерсть<span>Уже связана и распушена</span></div></section>
<footer><p id="instruction">Ведите ножницы за кольца. Режут только лезвия.<br><span>Небольшие проходы помогают выбрать форму.</span></p><div class="actions"><button id="undo" class="secondary" disabled>Отменить<br>проход</button><button id="finish">Оставить эту форму</button></div><p class="status" id="status" role="status" aria-live="polite">Подравнивайте край понемногу. Последний проход можно отменить.</p></footer></main><script type="module" src="app.mjs"></script></body></html>
