name: Content packages QA
on:
  pull_request:
    paths:
      - 'product/**'
      - 'play-preview/**'
      - 'craft-study/**'
      - 'material-study/**'
      - 'stage-study/**'
      - '.agents/skills/**'
      - 'AGENTS.md'
      - '.github/workflows/content-qa.yml'
  push:
    branches: [main]
    paths:
      - 'product/**'
      - 'play-preview/**'
      - 'craft-study/**'
      - 'material-study/**'
      - 'stage-study/**'
      - '.agents/skills/**'
      - 'AGENTS.md'
      - '.github/workflows/content-qa.yml'
  workflow_dispatch:

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm --prefix product test
      - name: Material shaping model regressions
        run: node --test product/research/craft-material-v1/model.test.mjs
      - name: Stage appearance timing and persistence regressions
        run: node --test product/research/stage-magic-v1/model.test.mjs
      - name: Validate content and references
        run: npm --prefix product run validate
      - name: Build ready-only browser catalog
        run: npm --prefix product run build
      - name: Enforce single-package agent ownership
        if: github.event_name == 'pull_request'
        env:
          AGENT_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: node product/scripts/check-agent-scope.mjs

  browser-loop:
    # Match the visual job; avoid implicit OS migrations in browser dependencies.
    runs-on: ubuntu-24.04
    # The suite takes ~7 minutes; slow apt downloads can add another ~8.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/mir-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/mir-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Build and exercise technical player loop
        run: |
          npm --prefix product run build
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/mir-browser/node_modules/playwright/index.mjs" node product/ui/browser-check.mjs
      - name: Fetch pinned draft artwork without promoting content
        run: |
          git fetch --no-tags origin 56a748cc0de532b40a1b9a0927ff1d900406d85b 0dbd5e2e2df90d54e6fe9cb45ff5da5e3955b7f4
      - name: Build and exercise the isolated static Pages preview
        run: |
          npm --prefix product run build:preview
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/mir-browser/node_modules/playwright/index.mjs" npm --prefix product run check:preview
          git diff --exit-code -- play-preview
          test -z "$(git ls-files --others --exclude-standard play-preview)"
      - name: Exercise the isolated craft-feel study
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/mir-browser/node_modules/playwright/index.mjs" node product/research/craft-feel-v1/check.mjs
      - name: Build and exercise the material shaping study
        run: |
          node product/research/craft-material-v1/build.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/mir-browser/node_modules/playwright/index.mjs" LOCAL_PREVIEW_PATH=/material-study/ node product/research/craft-material-v1/check.mjs
          git diff --exit-code -- material-study
          test -z "$(git ls-files --others --exclude-standard material-study)"
      - name: Build and exercise the staged appearance study
        run: |
          node product/research/stage-magic-v1/build.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/mir-browser/node_modules/playwright/index.mjs" LOCAL_PREVIEW_PATH=/stage-study/ node product/research/stage-magic-v1/check.mjs
          git diff --exit-code -- stage-study
          test -z "$(git ls-files --others --exclude-standard stage-study)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-study-mobile-evidence
          path: product/research/stage-magic-v1/evidence/qa-*/
          retention-days: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-study-mobile-evidence
          path: product/research/craft-material-v1/evidence/qa-*/
          retention-days: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: craft-study-mobile-evidence
          path: product/research/craft-feel-v1/evidence/*.png
          retention-days: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-technical-mobile-preview
          path: product/ui/review/*.png
          retention-days: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-static-pages-preview
          path: product/preview-evidence/*.png
          retention-days: 15

  public-stage-preview:
    if: github.event_name == 'push'
    needs: [validate-content, browser-loop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact public bundle from a GitHub-hosted runner
        env:
          REVIEWED_SHA: ${{ github.sha }}
          PREVIEW_URL: https://apazidi.github.io/mir-na-nitke/stage-study/
          WAIT_FOR_DEPLOY: '1'
        run: node product/research/stage-magic-v1/verify-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-study-https-receipt
          path: product/research/stage-magic-v1/evidence/https-receipt.json
          retention-days: 90

  public-gameplay-preview:
    if: github.event_name == 'push'
    needs: [validate-content, browser-loop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the exact integrated game from a GitHub-hosted runner
        env:
          REVIEWED_SHA: ${{ github.sha }}
          PREVIEW_URL: https://apazidi.github.io/mir-na-nitke/play-preview/
          WAIT_FOR_DEPLOY: '1'
        run: node product/research/stage-integration-v1/verify-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staged-gameplay-https-receipt
          path: product/research/stage-integration-v1/evidence/https-receipt.json
          retention-days: 90
