name: Visual design regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual testing dependencies
        run: |
          python -m pip install "playwright==1.57.0" "pillow>=11.0,<13"
          python -m playwright install --with-deps chromium
      - name: Validate visual contract
        run: |
          python tests/visual_guard.py
          python tests/functional_ui_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-preview-v4
          path: |
            design-system/latest-v4.1-preview.png
            design-system/latest-v4.1-after-flower.png
          retention-days: 15
      - name: Check unchanged gameplay
        run: |
          cd v4.1
          node --test tests/*.test.mjs
